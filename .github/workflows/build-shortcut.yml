name: Build ready-to-import shortcut

on:
  push:
    paths:
      - '.github/workflows/build-shortcut.yml'

permissions:
  contents: write

jobs:
  build-shortcut:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate shortcut plist
        run: |
          set -euo pipefail
          mkdir -p install
          python3 - <<'PY'
          import plistlib, uuid
          U=lambda: str(uuid.uuid4()).upper()
          workflow={
            'WFWorkflowActions':[
              {
                'WFWorkflowActionIdentifier':'is.workflow.actions.setclipboard',
                'WFWorkflowActionParameters':{
                  'UUID':U(),
                  'WFLocalOnly':True,
                },
              },
              {
                'WFWorkflowActionIdentifier':'is.workflow.actions.openapp',
                'WFWorkflowActionParameters':{
                  'UUID':U(),
                  'WFAppIdentifier':'app.yew1778.zenith9466',
                  'WFAppName':'红尘音卡',
                  'WFSelectedApp':{
                    'BundleIdentifier':'app.yew1778.zenith9466',
                    'Name':'红尘音卡',
                  },
                },
              },
            ],
            'WFWorkflowClientVersion':'2607.1.3',
            'WFWorkflowMinimumClientVersion':900,
            'WFWorkflowMinimumClientVersionString':'900',
            'WFWorkflowIcon':{
              'WFWorkflowIconGlyphNumber':61440,
              'WFWorkflowIconStartColor':4282601983,
            },
            'WFWorkflowImportQuestions':[],
            'WFWorkflowTypes':['ActionExtension'],
            'WFQuickActionSurfaces':[],
            'WFWorkflowHasShortcutInputVariables':True,
            'WFWorkflowHasOutputFallback':False,
            'WFWorkflowInputContentItemClasses':[
              'WFStringContentItem','WFURLContentItem','WFSafariWebPageContentItem','WFGenericFileContentItem'
            ],
            'WFWorkflowOutputContentItemClasses':[],
          }
          with open('/tmp/红尘音卡导入.wflow','wb') as f:
            plistlib.dump(workflow,f,fmt=plistlib.FMT_BINARY)
          PY

      - name: Sign shortcut for anyone
        run: |
          set -euo pipefail
          shortcuts sign --mode anyone --input '/tmp/红尘音卡导入.wflow' --output 'install/红尘音卡导入.shortcut'
          test -s 'install/红尘音卡导入.shortcut'
          file 'install/红尘音卡导入.shortcut' || true

      - name: Add download link to install page
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('install/index.html')
          s=p.read_text()
          marker='</body>'
          block='''\n<section style="max-width:760px;margin:28px auto;padding:20px;border-radius:20px;background:#fff7f7;">\n  <h2>一键导入快捷指令</h2>\n  <p>不用手动搭建。安装红尘音卡后，点下面按钮把现成的“导入汽水分享”加入 iPhone 快捷指令。</p>\n  <p><a href="./红尘音卡导入.shortcut" style="display:inline-block;padding:14px 20px;border-radius:14px;background:#bd2034;color:white;text-decoration:none;font-weight:700;">添加“导入汽水分享”快捷指令</a></p>\n</section>\n'''
          if '红尘音卡导入.shortcut' not in s:
            if marker not in s:
              raise SystemExit('index.html missing </body>')
            s=s.replace(marker,block+marker)
            p.write_text(s)
          PY

      - name: Commit generated shortcut
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'install/红尘音卡导入.shortcut' install/index.html
          git commit -m 'Publish ready-to-import Red Dust Music Card shortcut'
          git push
