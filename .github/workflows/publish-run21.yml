name: Publish Run 22 IPA

on:
  push:
    paths:
      - '.github/workflows/publish-run21.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Run 22 artifact and publish
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-0034-820b-8de1-2c3536195621/raw?se=2026-09-14T22%3A33%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=54cbfa0d-9948-59bb-bac1-6ffc26ad67bc&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T18%3A46%3A12Z&ske=2026-09-15T18%3A46%3A12Z&sks=b&skv=2026-02-06&sig=1Uq5UxaQlVWcCuXikiXfNeTVpgOrMtDNB1CtVAVORc0%3D' -o /tmp/run22.zip
          rm -rf /tmp/run22
          mkdir -p /tmp/run22
          unzip -q /tmp/run22.zip -d /tmp/run22
          IPA=$(find /tmp/run22 -maxdepth 2 -name '*.ipa' -type f | head -1)
          test -n "$IPA"
          mkdir -p install
          cp "$IPA" install/HongchenMusicCard-Run22.ipa
          ACTUAL=$(sha256sum install/HongchenMusicCard-Run22.ipa | awk '{print toupper($1)}')
          test "$ACTUAL" = 'DB23CC5DF47713E0F68D403C0FF9669AD6F286B2C9A10084FAE03E548A769576'

          python3 - <<'PY'
          from pathlib import Path
          p=Path('install/manifest.plist')
          s=p.read_text()
          s=s.replace('HongchenMusicCard-Run21.ipa','HongchenMusicCard-Run22.ipa')
          p.write_text(s)

          p=Path('install/index.html')
          s=p.read_text()
          s=s.replace('2026-09-14 20:40 (GMT+7)','2026-09-15 05:28 (GMT+7)')
          s=s.replace('GitHub Actions Run #21','GitHub Actions Run #22')
          s=s.replace('609CC09AFC36E1337BA583BD2086B5D54108AF021352AF025A86BED27BA7BA60','DB23CC5DF47713E0F68D403C0FF9669AD6F286B2C9A10084FAE03E548A769576')
          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install/HongchenMusicCard-Run22.ipa install/manifest.plist install/index.html
          git commit -m 'Publish signed Run 22 IPA'
          git push
