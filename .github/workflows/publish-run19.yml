name: Publish Run 19 IPA

on:
  push:
    branches:
      - run19-publish
    paths:
      - '.github/workflows/publish-run19.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify Run 19
        env:
          URL_B64: 
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$URL_B64" | base64 -d)"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/run19.zip
          rm -rf /tmp/run19 && mkdir -p /tmp/run19
          unzip -q /tmp/run19.zip -d /tmp/run19
          IPA="$(find /tmp/run19 -type f -name '*.ipa' | head -n 1)"
          test -n "$IPA"
          ACTUAL="$(sha256sum "$IPA" | awk '{print $1}')"
          EXPECTED='d74404eea75a62097715a2eb19933381e364e8fe243986081d80a10658a80ec0'
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p install
          cp "$IPA" install/HongchenMusicCard-Run19.ipa

      - name: Update OTA files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('install/manifest.plist')
          s = manifest.read_text()
          old = 'https://jianjunren28-sudo.github.io/music-card-share-site/install/HongchenMusicCard-1.0-1.ipa'
          new = 'https://jianjunren28-sudo.github.io/music-card-share-site/install/HongchenMusicCard-Run19.ipa'
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('Unexpected manifest IPA URL')
          manifest.write_text(s)

          page = Path('install/index.html')
          s = page.read_text()
          s = s.replace('2026-09-14 15:31 (GMT+7)', '2026-09-14 17:40 (GMT+7)')
          s = s.replace('GitHub Actions Run #17', 'GitHub Actions Run #19')
          s = s.replace('F878E55E7F640815F368604920CB3E4F22EE1181301B50FF7535AAA50E8648F7', 'D74404EEA75A62097715A2EB19933381E364E8FE243986081D80A10658A80EC0')
          page.write_text(s)
          PY

      - name: Commit published build
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/publish-run19.yml run19.txt
          git add -A
          git commit -m 'Publish signed IPA from Run #19'
          git push origin HEAD:run19-publish
