name: Build and publish Hongchen shortcut

on:
  push:
    paths:
      - '.github/workflows/publish-shortcut.yml'

permissions:
  contents: write

jobs:
  build-shortcut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and sign shortcut
        run: |
          set -euo pipefail
          mkdir -p install
          python3 - <<'PY'
          import plistlib, json, uuid
          from urllib.request import Request, urlopen
          from pathlib import Path

          def U():
              return str(uuid.uuid4()).upper()

          get_text_uuid = U()
          copy_uuid = U()
          open_uuid = U()

          shortcut_input = {
              'Value': {'Type': 'ExtensionInput'},
              'WFSerializationType': 'WFTextTokenAttachment',
          }
          text_output = {
              'Value': {
                  'OutputName': 'Text',
                  'OutputUUID': get_text_uuid,
                  'Type': 'ActionOutput',
              },
              'WFSerializationType': 'WFTextTokenAttachment',
          }

          shortcut = {
              'WFWorkflowActions': [
                  {
                      'WFWorkflowActionIdentifier': 'is.workflow.actions.gettext',
                      'WFWorkflowActionParameters': {
                          'UUID': get_text_uuid,
                          'WFTextActionText': shortcut_input,
                      },
                  },
                  {
                      'WFWorkflowActionIdentifier': 'is.workflow.actions.setclipboard',
                      'WFWorkflowActionParameters': {
                          'UUID': copy_uuid,
                          'WFInput': text_output,
                          'WFLocalOnly': True,
                      },
                  },
                  {
                      'WFWorkflowActionIdentifier': 'is.workflow.actions.openapp',
                      'WFWorkflowActionParameters': {
                          'UUID': open_uuid,
                          'WFAppIdentifier': 'app.yew1778.zenith9466',
                          'WFAppName': '红尘音卡',
                          'WFSelectedApp': {
                              'BundleIdentifier': 'app.yew1778.zenith9466',
                              'Name': '红尘音卡',
                              'TeamIdentifier': 'VX83Z69T89',
                          },
                      },
                  },
              ],
              'WFWorkflowClientVersion': '2607.1.3',
              'WFWorkflowMinimumClientVersion': 900,
              'WFWorkflowMinimumClientVersionString': '900',
              'WFWorkflowIcon': {
                  'WFWorkflowIconStartColor': 4282601983,
                  'WFWorkflowIconGlyphNumber': 61440,
              },
              'WFWorkflowImportQuestions': [],
              'WFWorkflowTypes': ['ActionExtension'],
              'WFQuickActionSurfaces': [],
              'WFWorkflowHasShortcutInputVariables': True,
              'WFWorkflowHasOutputFallback': False,
              'WFWorkflowInputContentItemClasses': [
                  'WFStringContentItem',
                  'WFURLContentItem',
                  'WFSafariWebPageContentItem',
                  'WFGenericFileContentItem',
              ],
              'WFWorkflowOutputContentItemClasses': [],
          }

          xml = plistlib.dumps(shortcut, fmt=plistlib.FMT_XML).decode('utf-8')
          payload = json.dumps({
              'shortcutName': '汽水转红尘音卡',
              'shortcut': xml,
          }, ensure_ascii=False).encode('utf-8')
          req = Request(
              'https://hubsign.routinehub.services/sign',
              data=payload,
              headers={
                  'Content-Type': 'application/json',
                  'User-Agent': 'cherri/1.0',
                  'Origin': 'https://routinehub.co',
                  'Referer': 'https://routinehub.co/',
              },
              method='POST',
          )
          with urlopen(req, timeout=30) as resp:
              signed = resp.read()
          if signed[:4] != b'AEA1':
              raise SystemExit(f'HubSign returned invalid shortcut envelope: {signed[:16]!r}')
          out = Path('install/Qishui-to-Hongchen.shortcut')
          out.write_bytes(signed)
          print(f'Wrote {out} ({len(signed)} bytes)')
          PY

          test -s install/Qishui-to-Hongchen.shortcut
          python3 - <<'PY'
          from pathlib import Path
          p = Path('install/shortcut.html')
          p.write_text('''<!doctype html>
          <html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>汽水转红尘音卡快捷指令</title>
          <style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;max-width:680px;margin:0 auto;padding:36px 20px;line-height:1.65;background:#fff8f7;color:#222}.card{background:white;border-radius:24px;padding:28px;box-shadow:0 8px 30px #0001}a.btn{display:block;text-align:center;background:#bd1f32;color:white;text-decoration:none;padding:16px;border-radius:16px;font-size:20px;font-weight:700;margin:24px 0}.small{color:#666;font-size:14px}</style>
          </head><body><div class="card"><h1>汽水转红尘音卡</h1><p>V2：从汽水音乐共享表单取得文本 → 写入剪贴板 → 自动打开“红尘音卡”。无需自己编辑动作。</p><a class="btn" href="Qishui-to-Hongchen.shortcut">下载并添加快捷指令 V2</a><p class="small">如手机里已有旧版，请先删除旧的“汽水转红尘音卡”，再添加本版。</p></div></body></html>''', encoding='utf-8')
          PY

      - name: Commit shortcut
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install/Qishui-to-Hongchen.shortcut install/shortcut.html
          git commit -m 'Publish fixed Qishui to Hongchen shortcut V2'
          git push
